# Baut bei jedem Pull Request die Windows-App und hängt sie als Artefakt an den Lauf.
# Zweck: Änderungen vor dem Merge ausprobieren, ohne Node/Yarn/Git zu installieren.
# Erstellt kein Release und keinen Tag (dafür ist release.yml zuständig).
name: PR Build

on:
  pull_request:

permissions:
  contents: read

# Ein neuer Push auf denselben PR bricht den noch laufenden Build ab.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      # --dir: entpackte App statt Zip. GitHub packt Artefakte beim Download
      # ohnehin in ein Zip; so entsteht kein Zip im Zip.
      - name: Package Windows app
        run: npx electron-builder build --win dir --x64 --publish never

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: juricane-windows-pr-${{ github.event.pull_request.number }}
          path: release/build/win-unpacked
          if-no-files-found: error
          retention-days: 7
