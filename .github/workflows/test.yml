name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      # Beide Plattformen immer zu Ende laufen lassen, auch wenn eine fehlschlägt.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: yarn install
        run: yarn install --frozen-lockfile

      # Einzelne Schritte statt eines mehrzeiligen Skripts: Unter Windows (PowerShell)
      # würde sonst nur der Exit-Code des letzten Befehls zählen.
      - name: yarn package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn package

      - name: yarn lint
        run: yarn lint

      - name: Typecheck
        run: npm exec tsc

      - name: yarn test
        run: yarn test
