# Claude Code als Cloud-Agent: reagiert auf "@claude" in Issues und Pull Requests.
# Auslösen dürfen nur Nutzer mit Schreibzugriff auf das Repo (prüft die Action selbst).
#
# Voraussetzungen (einmalig):
#   1. GitHub-App installieren: https://github.com/apps/claude
#   2. Repo-Secret anlegen (Settings → Secrets and variables → Actions):
#        ANTHROPIC_API_KEY          API-Schlüssel aus der Claude Console (Abrechnung nach Verbrauch)
#      oder
#        CLAUDE_CODE_OAUTH_TOKEN    Token für ein Claude-Abo, erzeugt mit `claude setup-token`
#      Bei der zweiten Variante unten die Zeile `anthropic_api_key` gegen die
#      auskommentierte Zeile `claude_code_oauth_token` tauschen.
name: Claude Code

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

# Pro Issue/PR läuft immer nur ein Agent gleichzeitig.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Runner nur starten, wenn "@claude" wirklich vorkommt.
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Node für die Prüfbefehle aus AGENTS.md (yarn lint / tsc / build / test).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Erlaubt dem Agenten, Abhängigkeiten zu installieren und die Prüfbefehle auszuführen.
          claude_args: '--allowedTools "Bash(yarn:*),Bash(npx tsc:*)"'
